{% extends 'base.html' %}

{% block title %}Registrar Movimiento{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-warning text-dark">
                <h4 class="mb-0">Registrar Entrada/Salida</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">{{ form.product.label }}</label>
                        {{ form.product }}
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">{{ form.movement_type.label }}</label>
                            {{ form.movement_type }}
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">{{ form.quantity.label }}</label>
                            {{ form.quantity }}
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">{{ form.reason.label }}</label>
                        {{ form.reason }}
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-warning">Confirmar Movimiento</button>
                        <a href="{% url 'product_list' %}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
